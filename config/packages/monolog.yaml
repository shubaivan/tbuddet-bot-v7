monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50
            nested:
                type: stream
                path: "%kernel.logs_dir%/prod.log"
                level: debug
                formatter: monolog.formatter.json
            # Сканери ботів довбляться в /.env, /wp-config.php і подібне —
            # Symfony віддає 404, а прямий stream-хендлер писав кожен такий
            # промах як ERROR: 17 тисяч записів із 17 тисяч, 13 МБ сміття.
            # Тепер журнал помилок фільтрує 404/405 так само, як main.
            error_file:
                type: fingers_crossed
                action_level: error
                handler: error_file_nested
                excluded_http_codes: [404, 405]
                buffer_size: 50
            error_file_nested:
                type: stream
                path: "%kernel.logs_dir%/prod_errors.log"
                level: error
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: "%kernel.logs_dir%/prod_deprecations.log"
                formatter: monolog.formatter.json
