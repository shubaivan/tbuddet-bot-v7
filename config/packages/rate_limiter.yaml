framework:
    rate_limiter:
        # Події активності (візити/кліки) — часті, але з захистом від флуду per-IP.
        event:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'
        # ІІ-консультант (кожен виклик = токени Claude) — суворіше, per-IP.
        chat:
            policy: 'sliding_window'
            limit: 25
            interval: '1 minute'
        # Денний ліміт per-IP — стоп сталому абузу з однієї адреси.
        chat_daily:
            policy: 'fixed_window'
            limit: 200
            interval: '1 day'
        # Вхід у чат (телефон → лід у групу) — per-IP, щоб не засмічували групу.
        chat_start:
            policy: 'sliding_window'
            limit: 6
            interval: '10 minutes'
        # «Надіслати рахунок ще раз» з кабінету — per order, щоб не засипати клієнта/бота.
        invoice_resend:
            policy: 'fixed_window'
            limit: 1
            interval: '3 minutes'
